name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include clipboard contents, history files, credentials, or private screenshots.
  - type: input
    id: version
    attributes:
      label: ClipShelf version
      placeholder: 0.5.4
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include what you expected and what happened.
    validations:
      required: true
