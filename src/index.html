<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>ClipShelf</title><link rel="stylesheet" href="style.css"></head>
<body><div id="shell">
<div id="resize-handle" title="上下拖动调整面板高度" aria-hidden="true"><span></span></div>
<header>
<button class="icon-button app-mark" id="about" title="ClipShelf · 本地剪贴板"><img src="assets/clipshelf-64.png" width="26" height="26" alt="ClipShelf" draggable="false"></button>
<div class="search-wrap"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索剪贴板" aria-label="搜索剪贴板" autocomplete="off" spellcheck="false"><button id="clear-search" class="icon-button" data-icon="close" title="清空搜索" hidden></button><kbd>Ctrl F</kbd></div>
<div id="tabs" role="tablist" aria-label="剪贴板与收藏分组"></div>
<button id="add-group" class="icon-button" data-icon="plus" title="新建分组 · Ctrl+Shift+N" aria-label="新建分组"></button>
<span class="spacer"></span>
<button id="filters-toggle" class="icon-button" data-icon="filter" title="搜索筛选" aria-label="搜索筛选" aria-expanded="false"></button>
<button id="stack-add" class="icon-button" data-icon="paste" title="加入顺序粘贴队列 · Ctrl+Shift+S" aria-label="加入顺序粘贴队列"></button><button id="new-item" class="icon-button" data-icon="edit" title="新建文本 · Ctrl+N" aria-label="新建文本"></button>
<button id="compact" class="icon-button" data-icon="grid" title="切换紧凑模式" aria-label="切换紧凑模式"></button>
<button id="import-image" class="icon-button" data-icon="image" title="导入图片 · Ctrl+O" aria-label="导入本地图片"></button>
<button id="settings" class="icon-button" data-icon="settings" title="偏好设置 · Ctrl+," aria-label="偏好设置"></button>
<button id="hide" class="icon-button" data-icon="close" title="收起 · Esc" aria-label="收起"></button>
</header>
<div id="filters" hidden><label>类型<select id="kind-filter"><option value="all">全部内容</option><option value="text">文本</option><option value="image">图片</option><option value="code">代码</option><option value="link">链接</option><option value="color">颜色</option></select></label><label>时间<select id="days-filter"><option value="0">全部时间</option><option value="1">最近一天</option><option value="7">最近一周</option><option value="30">最近一个月</option></select></label><label>来源<select id="source-filter"><option value="">全部应用</option></select></label><button id="reset-filters">清除筛选</button></div>
<div class="collection-line"><span id="section-title">剪贴板</span><span id="count"></span><span id="multi-count"></span><span class="spacer"></span><button id="edit-group" hidden>编辑分组</button><button id="remove-group" hidden>删除分组</button><button id="undo" hidden>撤销</button><button id="clear">清理历史</button><button id="pause"></button><button id="pause-duration" title="选择暂停时长" aria-label="选择暂停时长">▾</button></div>
<div id="stack-bar" hidden><strong id="stack-count"></strong><span id="stack-next-title"></span><span class="spacer"></span><button id="stack-next">粘贴下一项</button><button id="stack-copy">复制下一项</button><button id="stack-reverse">反转顺序</button><button id="stack-clear">清空队列</button></div><main><div id="cards" role="listbox" tabindex="0" aria-label="剪贴板内容" aria-multiselectable="true"><div id="cards-track"></div></div><div id="empty" hidden><div class="empty-icon" data-icon="shelf"></div><h2>每一次复制，都有迹可循。</h2><p>复制文字、链接或颜色，下一次灵感就在这里。</p><div class="empty-shortcuts"><kbd>Ctrl C</kbd><span>复制</span><b>→</b><kbd id="activation-key">Ctrl Shift V</kbd><span>唤起</span></div></div></main>
<footer><span id="recording"></span><span class="footer-brand">ClipShelf</span><span id="feedback" role="status" aria-live="polite"></span><span class="spacer"></span><span><kbd>←</kbd><kbd>→</kbd> 选择</span><span><kbd>Space</kbd> 预览</span><span><kbd>Ctrl 1–9</kbd> 快速粘贴</span><span><kbd>Enter</kbd> 粘贴</span><span><kbd>Esc</kbd> 收起</span></footer>
</div>
<dialog id="group-dialog"><form id="group-form"><div class="dialog-heading"><span data-icon="plus"></span><h2 id="group-heading">新建收藏分组</h2><button type="button" class="icon-button close-dialog" data-icon="close" aria-label="关闭"></button></div><p>给常用内容留一个专属的位置。</p><label class="field-label" for="group-name">名称</label><input id="group-name" maxlength="30" placeholder="例如：工作片段、灵感、常用回复" required><div id="group-colors" role="radiogroup" aria-label="分组颜色"></div><div class="dialog-actions"><button type="button" class="secondary close-dialog">取消</button><button class="primary" type="submit">保存分组</button></div></form></dialog>
<dialog id="preview-dialog"><form id="preview-form"><div class="dialog-heading"><span id="preview-kind" data-icon="text"></span><h2 id="preview-heading">快速预览</h2><span class="spacer"></span><button type="button" id="preview-edit" class="icon-button" data-icon="edit" title="编辑"></button><button type="button" class="icon-button close-dialog" data-icon="close" aria-label="关闭"></button></div><input id="item-title" maxlength="100" aria-label="片段名称" placeholder="添加名称，让它更容易被找到"><div id="image-tools" hidden><button type="button" id="image-fit">适应窗口</button><button type="button" id="image-actual">100%</button><button type="button" id="image-out" aria-label="缩小图片">−</button><input type="range" id="image-zoom" min="1" max="400" value="100" aria-label="图片缩放"><button type="button" id="image-in" aria-label="放大图片">＋</button><span id="image-scale">100%</span><span class="spacer"></span><button type="button" id="image-left" title="向左旋转并保存">↶</button><button type="button" id="image-right" title="向右旋转并保存">↷</button><button type="button" id="image-export">另存为</button></div><div id="preview-image-wrap" hidden><div id="preview-stage"><img id="preview-image" alt="图片预览" draggable="false"></div></div><textarea id="item-text" aria-label="片段内容" spellcheck="false"></textarea><div class="preview-meta" id="preview-meta"></div><p class="form-error" id="preview-error" role="alert"></p><div class="dialog-actions"><button type="button" id="preview-copy" class="secondary">复制内容</button><button type="button" id="preview-paste" class="secondary">粘贴到原窗口</button><button type="submit" id="preview-save" class="primary">保存修改</button></div></form></dialog>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-heading"><span data-icon="settings"></span><h2>偏好设置</h2><button type="button" class="icon-button close-dialog" data-icon="close" aria-label="关闭"></button></div><p>让剪贴板适应你的节奏。</p><label class="setting-row"><span>外观<small>明亮、深色，或跟随系统</small></span><select id="setting-theme"><option value="system">跟随系统</option><option value="light">明亮</option><option value="dark">深色</option></select></label><label class="setting-row"><span>登录 Windows 时启动<small id="startup-hint">启动后驻留托盘，不弹出面板；便携版需保留在固定位置</small></span><input type="checkbox" id="setting-startup" class="switch"></label><label class="setting-row"><span>唤起快捷键</span><select id="setting-shortcut"><option>Ctrl+Shift+V</option><option>Ctrl+Alt+V</option><option>Alt+V</option></select></label><label class="setting-row"><span>保留历史<small>收藏和分组中的内容不受影响</small></span><select id="setting-retention"><option value="0">不限时间</option><option value="7">7 天</option><option value="30">30 天</option><option value="90">90 天</option></select></label><label class="setting-row"><span>多项粘贴分隔符</span><select id="setting-separator"><option value="line">换行</option><option value="paragraph">空行</option><option value="space">空格</option><option value="tab">制表符</option></select></label><label class="setting-row"><span>点击其他窗口时收起</span><input type="checkbox" id="setting-blur" class="switch"></label><label class="setting-row"><span>减少动态效果</span><input type="checkbox" id="setting-motion" class="switch"></label><label class="setting-row"><span>紧凑模式</span><input type="checkbox" id="setting-compact" class="switch"></label><label class="setting-row"><span>记录图片<small>图片与缩略图在本机加密保存</small></span><input type="checkbox" id="setting-images" class="switch"></label><label class="setting-row"><span>始终以纯文本粘贴<small>也可用 Shift+Enter 临时去除格式</small></span><input type="checkbox" id="setting-plain" class="switch"></label><label class="setting-row"><span>忽略标记为机密的内容</span><input type="checkbox" id="setting-confidential" class="switch"></label><label class="field-label" for="setting-ignored-apps">不记录这些应用（进程名，每行一个，例如 KeePass.exe）</label><textarea id="setting-ignored-apps" rows="3" spellcheck="false"></textarea><div class="privacy-note"><span data-icon="shield"></span><span>历史与图片仅在本机加密保存。复制敏感内容前可暂停记录。</span></div><p class="form-error" id="settings-error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary close-dialog">取消</button><button class="primary" type="submit">保存设置</button></div></form></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-description"></p><div class="dialog-actions"><button class="secondary close-dialog">取消</button><button id="accept-confirm" class="primary">确认</button></div></dialog>
<div id="context-menu" role="menu" hidden></div>
<script src="view-model.js"></script><script src="icons.js"></script><script src="shelf-receiver.js"></script><script src="renderer.js"></script></body></html>
